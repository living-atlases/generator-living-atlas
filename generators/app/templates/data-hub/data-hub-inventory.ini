<%_
LA_urls_prefix = LA_enable_ssl ? 'https://' : 'http://';

// A hub deployed with la-docker-compose gets its own containers inside the
// portal's compose stack. Ansible keeps writing the config to a HOST directory
// that carries the hub name (/data/<pkg>-hub), and the container mounts it at the
// path the stock image reads (/data/ala-hub). Hence the rule that decides every
// path below: the hub identity lives in host paths, never in container paths, so
// any variable the APPLICATION reads as a path must render the container one.
const isCompose = (typeof LA_use_docker_compose !== 'undefined' && LA_use_docker_compose);
const localhostMode = (typeof LA_localhost_mode !== 'undefined' && LA_localhost_mode);

const hubDataDir = isCompose ? '/data/ala-hub' : `/data/${LA_pkg_name}-hub`;
// bie-hub's own container mount (bie-hub.yml.j2): always /data/ala-bie-hub,
// regardless of the hub's host dir name (<pkg>-bie-hub) -- same host/container
// split as hubDataDir above, just bie-hub's own fixed mount point.
const bieHubDataDir = isCompose ? '/data/ala-bie-hub' : `/data/${LA_pkg_name}-bie-hub`;

const brandingHost = (typeof LA_branding_hostname !== 'undefined' && LA_branding_hostname)
  ? LA_branding_hostname : LA_main_hostname;

// A hub with the branding service off has no branding of its own: it consumes
// whatever its header_and_footer_baseurl already serves (the portal's, normally),
// so it must not claim the branding groups nor a build of its own.
const hubBranding = (typeof LA_use_branding === 'undefined') || LA_use_branding;

// The machine that runs a hub service is the portal's machine for that service
// (a hub owns no infrastructure). In compose each hub service needs its own
// inventory alias on that machine, or the portal's alias for the same group would
// swallow the hub's variables: la-compose resolves aliases with
// `^<ansible_host>(\..+)?$`, so `<host>.<service>_<pkg>` still matches the host.
const hubHost = (physicalHost) => localhostMode ? 'localhost' : physicalHost;
const hubEntry = (svcKey, physicalHost) => isCompose
  ? `${hubHost(physicalHost)}.${svcKey}_${LA_pkg_name}`
  : hubHost(physicalHost);
_%>
<%_ if (isCompose) { _%>
[all]
<%= hubEntry('ala_hub', LA_ala_hub_hostname) %> ansible_host=<%= hubHost(LA_ala_hub_hostname) %>
<%= hubEntry('branding', brandingHost) %> ansible_host=<%= hubHost(brandingHost) %>
<%_ if (LA_use_species) { _%>
<%= hubEntry('ala_bie', LA_ala_bie_hostname) %> ansible_host=<%= hubHost(LA_ala_bie_hostname) %>
<%_ } _%>
<%_ if (LA_use_regions) { _%>
<%= hubEntry('regions', LA_regions_hostname) %> ansible_host=<%= hubHost(LA_regions_hostname) %>
<%_ } _%>

<%_ } _%>
[biocache-hub-<%= LA_pkg_name %>]

<%= hubEntry('ala_hub', LA_ala_hub_hostname) %>

<%_ if (hubBranding) { _%>
[branding-<%= LA_pkg_name %>]

<%= hubEntry('branding', brandingHost) %>

<%_ } _%>
<%_ if (LA_use_species) { _%>
[bie-hub-<%= LA_pkg_name %>]

<%= hubEntry('ala_bie', LA_ala_bie_hostname) %>

<%_ } _%>
<%_ if (LA_use_regions) { _%>
[regions-<%= LA_pkg_name %>]

<%= hubEntry('regions', LA_regions_hostname) %>

<%_ } _%>
[hub-<%= LA_pkg_name %>:children]

biocache-hub-<%= LA_pkg_name %>
<%_ if (hubBranding) { _%>
branding-<%= LA_pkg_name %>
<%_ } _%>
<%_ if (LA_use_species) { _%>
bie-hub-<%= LA_pkg_name %>
<%_ } _%>
<%_ if (LA_use_regions) { _%>
regions-<%= LA_pkg_name %>
<%_ } _%>

<%_ if (hubBranding) { _%>
[branding:children]
branding-<%= LA_pkg_name %>
<%_ } _%>
[biocache-hub:children]
biocache-hub-<%= LA_pkg_name %>
<%_ // Conditional like the groups above: an unconditional :children entry makes
    // Ansible auto-create an empty bie-hub-<pkg>/regions-<pkg> and inject it into
    // the canonical group even for a hub that deploys neither. _%>
<%_ if (LA_use_species) { _%>
[bie-hub:children]
bie-hub-<%= LA_pkg_name %>
<%_ } _%>
<%_ if (LA_use_regions) { _%>
[regions:children]
regions-<%= LA_pkg_name %>
<%_ } _%>

[hub-<%= LA_pkg_name %>:vars]
# Prioritize this over portal other vars
ansible_group_priority = 10

# used in biocache and bie hubs
biocache_query_context = <% if (typeof LA_variable_biocache_query_context != 'undefined') { %><%- LA_variable_biocache_query_context %><% } else { %> data_hub_uid:dh1<%_ } %>

# used in regions
enable_query_context = true
query_context = <% if (typeof LA_variable_biocache_query_context != 'undefined') { %><%- LA_variable_biocache_query_context %><% } else { %> data_hub_uid:dh1<%_ } %>
hub_filter = <% if (typeof LA_variable_biocache_query_context != 'undefined') { %><%- LA_variable_biocache_query_context %><% } else { %> data_hub_uid:dh1<%_ } %>
enable_hub_data = true

orgNameLong = <%= LA_project_name %>
orgNameShort = <%= LA_project_shortname %>

header_and_footer_baseurl = <%= LA_urls_prefix %><% if (typeof LA_branding_url != 'undefined') { %><%- LA_branding_url %><% } else { %><%- LA_domain %><%_ } %><% if (typeof LA_branding_path != 'undefined') { %><%- LA_branding_path.replace(/\/$/, "") %><% } else { %><%_ } %>
header_and_footer_version = 2

orgCity = <% if (typeof LA_variable_orgCity != 'undefined') { %><%- LA_variable_orgCity %><% } else { %>Camberra<%_ } %>
orgStateProvince = <% if (typeof LA_variable_orgStateProvince != 'undefined') { %><%- LA_variable_orgStateProvince %><% } else { %>ACT<%_ } %>
orgPostcode = <% if (typeof LA_variable_orgPostcode != 'undefined') { %><%- LA_variable_orgPostcode %><% } else { %>2601<%_ } %>
orgCountry = <% if (typeof LA_variable_orgCountry != 'undefined') { %><%- LA_variable_orgCountry %><% } else { %>Australia<%_ } %>

orgPhone=
orgFax=
org_url = <% if (typeof LA_branding_url != 'undefined') { %><%= LA_urls_prefix %><%- LA_branding_url %><% } else { %><%= LA_urls_prefix %><%= LA_domain %><%_ } %>
skin_home_url = <% if (typeof LA_branding_url != 'undefined') { %><%= LA_urls_prefix %><%- LA_branding_url %><% } else { %><%= LA_urls_prefix %><%= LA_domain %><%_ } %>
ala_base_url = <% if (typeof LA_branding_url != 'undefined') { %><%= LA_urls_prefix %><%- LA_branding_url %><% } else { %><%= LA_urls_prefix %><%= LA_domain %><%_ } %>

###### favicon #######
favicon_url=<% if (typeof LA_variable_favicon_url != 'undefined') { %><%- LA_variable_favicon_url %><% } else { %>https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico<% } %>
skin_favicon=<% if (typeof LA_variable_favicon_url != 'undefined') { %><%- LA_variable_favicon_url %><% } else { %>https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico<% } %>

biocache_hub_hostname = <%= LA_ala_hub_url %>
biocache_hub_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %><%= LA_ala_hub_path %>
biocache_hub_base_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %>
biocache_hub_context_path = <%= LA_ala_hub_path %>
biocache_base_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %><%= LA_ala_hub_path %>
biocache_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %><%= LA_ala_hub_path %>

use_ala_bie=<%= LA_use_species %>
use_ala_image_service=<%= LA_use_images %>
use_ala_spatial_portal=<%= LA_use_spatial %>

<%_ if (LA_use_species) { _%>
bie_hub_base_url = <%= LA_urls_prefix %><%= LA_ala_bie_url %>
bie_hub_hostname = <%= LA_ala_bie_url %>
bie_hub_context_path = <%= LA_ala_bie_path %>
bie_base_url = <%= LA_urls_prefix %><%= LA_ala_bie_url %><%= LA_ala_bie_path %>
<%_ } _%>
<%_ if (LA_use_regions) { _%>
regions_base_url = <%= LA_urls_prefix %><%= LA_regions_url %>
regions_hostname = <%= LA_regions_url %>
regions_context_path = <%= LA_regions_path %>

explore_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %><%= LA_ala_hub_path %>/explore/your-area/
regions_explore_url = <%= LA_urls_prefix %><%= LA_regions_url %><%= LA_regions_path %>
regions_map_bounds = <% if (typeof LA_regions_map_bounds != 'undefined') { %><%- LA_regions_map_bounds %><% } else { %>[]<%_ } %>
# Only used in regions
biocache_records_url = <%= LA_urls_prefix %><%= LA_ala_hub_url %><%= LA_ala_hub_path %>
<%_ } _%>

explore_your_area_lat = <% if (typeof LA_collectory_map_centreMapLat != 'undefined') { %><%- LA_collectory_map_centreMapLat %><% } else { %>16.942<%_ } %>
explore_your_area_lng = <% if (typeof LA_collectory_map_centreMapLng != 'undefined') { %><%- LA_collectory_map_centreMapLng %><% } else { _%>1.261<%_ } %>
explore_your_area_location = <% if (typeof LA_variable_map_zone_name != 'undefined') { %><%- LA_variable_map_zone_name %><% } else { %>Australia<%_ } %>

map_default_latitude = <% if (typeof LA_collectory_map_centreMapLat != 'undefined') { %><%- LA_collectory_map_centreMapLat %><% } else { %>16.942<%_ } %>
map_default_longitude = <% if (typeof LA_collectory_map_centreMapLng != 'undefined') { %><%- LA_collectory_map_centreMapLng %><% } else { _%>1.261<%_ } %>
map_default_zoom = 5
zoom_outside_scoped_region = false

skin_taxa_links_base_url = <%= LA_urls_prefix %><%= LA_ala_bie_url %><%= LA_ala_bie_path %>/species/

grouped_facets_json=grouped_facets_default.json
<%_ // Read by the hub app itself, so it renders the container path under compose
    // (/data/ala-hub) and the host path on a VM (/data/<pkg>-hub). The neighbouring
    // grouped_facets_json / overlays_json / menu_config_json / blacklist_file are
    // Ansible-side template SOURCES, not app paths, and must stay as they are. _%>
biocache_grouped_facets_url=file://<%= hubDataDir %>/config/grouped_facets_default.json
# For customization override this:
# grouped_facets_json = {{inventory_dir}}/files/grouped_facets_<%= LA_pkg_name %>.json
# overlays_json = {{inventory_dir}}/files/overlays-<%= LA_pkg_name %>.json

# BIE blacklist - use portal's blacklist file
blacklist_file = ../<%= LA_portal_pkg_name %>-inventories/blacklist-prod.json

<%_
// Effective use_la_site_certs: an explicit `true` always wins, and so does the
// domain auto-detect (l-a.site or any subdomain -> demo wildcard certs) even
// over a STORED `false` -- a hub inherits the same nginx/cert setup as the
// portal it belongs to, so a stale per-hub `false` (a la-toolkit hub-creation
// default, not a deliberate choice: nobody wants snakeoil on a public
// *.l-a.site vhost) must not defeat it. Only an explicit `false` under a
// domain the auto-detect does NOT recognise is honoured. Scoped to
// docker-compose so VM deploys keep their previous behaviour.
var _explicitTrue = (typeof LA_variable_use_la_site_certs != 'undefined')
  && (LA_variable_use_la_site_certs === true || LA_variable_use_la_site_certs === 'true');
var _domainAutoDetect = typeof LA_use_docker_compose != 'undefined' && LA_use_docker_compose
  && typeof LA_domain != 'undefined' && /(^|\.)l-a\.site$/.test(LA_domain);
var _use_la_site_certs = _explicitTrue || _domainAutoDetect;
_%>
<%_ if (LA_enable_ssl) { _%>
<%_ if (_use_la_site_certs) { _%>
ssl_certificate_server_dir=/etc/letsencrypt/live/l-a.site
ssl_cert_file=fullchain.pem
ssl_key_file=privkey.pem
<%_ } else { _%>
ssl_certificate_server_dir=/etc/ssl
ssl_cert_file=certs/ssl-cert-snakeoil.pem
ssl_key_file=private/ssl-cert-snakeoil.key
<%_ } _%>
<%_ } _%>

# End of common hub vars

[branding-<%= LA_pkg_name %>:vars]

branding_hostname = <% if (typeof LA_branding_hostname != 'undefined') { %><%- LA_branding_hostname %><% } else { %><%- LA_main_hostname %><%_ } %>
branding_url = <% if (typeof LA_branding_url != 'undefined') { %><%- LA_branding_url %><% } else { %><%- LA_main_hostname %><%_ } %>
branding_path = <% if (typeof LA_branding_path != 'undefined') { %><%- LA_branding_path %><% } else { %>/<%_ } %>
<%_ if (isCompose) { _%>
branding_appname = branding-<%= LA_pkg_name %>
<%_ } _%>

[biocache-hub-<%= LA_pkg_name %>:vars]
ansible_group_priority = 10
# the configuration will generated in /data/<%= LA_pkg_name %>-hub to avoid possible conflicts with other
# biocache services in a same server
biocache_hub = <%= LA_pkg_name %>-hub
biocache_hub_artifact = ala-hub
skin_layout = ala
<%_ if (isCompose) { _%>
# Each hub is its own container, so nginx proxies to it by container name. The
# config file keeps its host name here and docker mounts it onto the name the
# stock image expects, which is why no *_config override is needed.
biocache_hub_docker_host = la_biocache-hub-<%= LA_pkg_name %>
<%_ } _%>

<%_ if (LA_use_species) { _%>
[bie-hub-<%= LA_pkg_name %>:vars]
ansible_group_priority = 10
# the configuration will generated in /data/<%= LA_pkg_name %>-bie-hub to avoid possible conflicts with other
# bie services in a same server
bie_hub = <%= LA_pkg_name %>-bie-hub
bie_hub_artifact = "{{ 'ala-bie-hub' if bie_hub_version is version('2', '>=') else 'ala-bie' }}"
bie_skin_layout = ala
<%_ if (isCompose) { _%>
# appname is host-global: it names the gatus check file and the vhost fragment
# suffix, so two hubs on one host need distinct ones.
bie_hub_appname = <%= LA_pkg_name %>-bie-hub
bie_hub_upstream_host = la_bie-hub-<%= LA_pkg_name %>
<%_ } _%>
# Read by the hub app itself (bie-hub-config.yml's languageCodesUrl / external.blacklist),
# so it renders the container path under compose (/data/ala-bie-hub) and the host path
# on a VM (/data/<pkg>-bie-hub) -- same rule as biocache_grouped_facets_url above. Without
# this the app looks for /data/<pkg>-bie-hub/... INSIDE a container that only ever mounts
# /data/ala-bie-hub, gets a FileNotFoundException on languages.json and crash-loops
# (la-docker-compose build #402).
bie_hub_language_codes_url=file://<%= bieHubDataDir %>/config/languages.json
bie_hub_blacklist_url=file://<%= bieHubDataDir %>/config/blacklist.json

<%_ } _%>
<%_ if (LA_use_regions) { _%>
[regions-<%= LA_pkg_name %>:vars]
ansible_group_priority = 10
# the configuration will generated in /data/<%= LA_pkg_name %>-regions to avoid possible conflicts with other
# regions services in a same server
regions = <%= LA_pkg_name %>-regions
regions_artifact = regions
<%_ if (isCompose) { _%>
regions_appname = <%= LA_pkg_name %>-regions
regions_upstream_host = regions-<%= LA_pkg_name %>
nginx_upstream_host = regions-<%= LA_pkg_name %>
<%_ } _%>
# menu_config_json = {{inventory_dir}}/files/menu-config-<%= LA_pkg_name %>.json

regions_skin_layout = "{{ 'ala-main' if regions_version is version('3.4', '>=') else 'main' }}"

# TODO bie and biocache base url is different

<%_ } _%>
