    update_cache: yes
    # Sibling service aliases on the same physical host may hold the dpkg lock;
    # wait for it instead of failing (see inventory host aliases).
    lock_timeout: 300
  tags: pre-task-deps
  when: ansible_os_family == "Debian" and ansible_distribution_version is version("20.04", ">=") and ansible_distribution_version is version("24.04", "<")

