# Addionial LA pre deploy tasks

# https://github.com/AtlasOfLivingAustralia/documentation/wiki/Before-Start-Your-LA-Installation#default-user-ubuntu
- name: Add the user "{{ def_ansible_user }}"
  user: name="{{ def_ansible_user }}" shell=/bin/bash
  tags: pre-task-def-user

# https://github.com/AtlasOfLivingAustralia/documentation/wiki/SSH-for-Beginners#ssh-keys
- name: Add the ssh key to user "{{ def_ansible_user }}"
  authorized_key:
    user: "{{ def_ansible_user }}"
    state: present
    key: '{{ item }}'
  with_file: "{{ ssh_keys }}"
  tags: pre-task-ssh-keys

  # Comented for security reasons
  # - name: Add the ssh key to user 'root'
  # authorized_key:
  #   user: root
  #   state: present
  #   key: '{{ item }}'
  # with_file: "{{ ssh_keys }}"
  # tags: pre-task-ssh-keys

- name: configure byobu
  debconf:
    name: byobu
    question: byobu/launch-by-default
    value: 'True'
    vtype: boolean
  # Multiple service aliases can map to the same physical host (see inventory
  # aliases), so this may race on /var/cache/debconf/config.dat while a sibling
  # alias runs apt. Retry until the debconf lock is free.
  register: byobu_debconf
  until: byobu_debconf is succeeded
  retries: 30
  delay: 10
  tags: pre-task-deps

- name: Add additional dependencies for monitoring, troubleshooting, ...
  apt:
    name:
      - nagios-plugins
      - python-pymongo
      - netcat
      - curl
      - lsof
      - iputils-ping
      - byobu
      - fail2ban
      - ssl-cert
      - etckeeper
    state: present
    autoclean: yes
    update_cache: yes
    # Sibling service aliases on the same physical host may hold the dpkg lock;
    # wait for it instead of failing (see inventory host aliases).
    lock_timeout: 300
  tags: pre-task-deps
  when: ansible_os_family == "Debian" and ansible_distribution_version is version("20.04", "<")

- name: Add additional dependencies for monitoring, troubleshooting, ...
  apt:
    name:
      - nagios-plugins
