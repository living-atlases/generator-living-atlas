- name: Pre-install python
  # One host per physical server: these are machine-level tasks; running them on
  # every service alias of the same VM in parallel races on the apt/dpkg locks.
  hosts: la_pre_deploy_hosts
  gather_facts: false
  pre_tasks:
  - name: Install python2 and python3 for Ansible
    raw: bash -c "test -e /usr/bin/python || (apt -qqy update && apt-get install -qqy python3-minimal 'python2.*-minimal')"
    register: output
    changed_when: output.stdout != ""
  - name: Gathering Facts
    setup:
  become: yes

- name: Pre-deploy tasks
  # One host per physical server (see la_pre_deploy_hosts): machine-level setup
  # (etc-hosts, sudo, users, apt deps) must not run once per service alias.
  hosts: la_pre_deploy_hosts
  roles:
<% if (typeof LA_etc_hosts != 'undefined') { %>
    - { role: ypsman.hosts, tags: ["pre-task-etc-hosts"]}
<% } %>
    - { role: weareinteractive.sudo, tags: ["pre-task-sudo"] }
    - pre_deploy
  become: yes

- name: Pre-deploy solr tasks
  hosts: solr7-server, solrcloud
  roles:
    - solr_pre_deploy
  become: yes

<%_ if (LA_use_pipelines) { _%>
- name: Pre-deploy spark tasks
  hosts: spark
  roles:
    - spark_pre_deploy
  become: yes
<%_ } _%>

<%_ if (LA_use_solrcloud) { _%>
- name: Pre-deploy zookeeper tasks
  hosts: zookeeper
  roles:
    - zookeeper_pre_deploy
  become: yes
<%_ } _%>
